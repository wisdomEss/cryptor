name: Deploy to Production

on:
  push:
    branches: [ main ]

# Dépôt public + runner self-hosted : ne jamais ajouter de trigger
# `pull_request` / `pull_request_target` sur ce workflow (exécution de code
# de forks sur le serveur). Les tests des PR vivent dans ci.yml (runner GitHub).
# Le jeton GITHUB_TOKEN est limité à la lecture.
permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy production .env for build
        run: cp /var/www/laravel/cryptor/.env .env

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Install NPM dependencies & build assets
        run: |
          npm ci
          npm run build

      - name: Sync files to deployment path
        run: |
          # -rlt (et non -a) : ne tente pas de recopier propriétaire/groupe/permissions,
          # ce que l'utilisateur du runner n'a pas le droit de faire (erreurs chgrp).
          rsync -rlt --no-perms --no-owner --no-group --delete \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/' \
            --exclude='node_modules/' \
            ./ /var/www/laravel/cryptor/

      - name: Run deployment tasks
        run: |
          cd /var/www/laravel/cryptor
          # bootstrap/cache n'est pas synchronisé : on retire les caches périmés
          # (ex. providers de dev comme Pail) puis on les régénère avec le vendor --no-dev.
          rm -f bootstrap/cache/packages.php bootstrap/cache/services.php \
                bootstrap/cache/config.php bootstrap/cache/routes-*.php \
                bootstrap/cache/events.php
          php artisan package:discover --ansi
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          sudo systemctl reload php8.4-fpm
          sudo systemctl reload nginx
