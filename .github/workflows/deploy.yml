name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, openssl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Generate app key
        run: php artisan key:generate

      - name: Install NPM dependencies
        run: npm ci

      - name: Lint PHP (Pint)
        run: vendor/bin/pint --test

      - name: Lint JS/Vue (ESLint)
        # `npm run lint` auto-fixes (--fix); here we only want to check.
        run: npx eslint .

      - name: Generate Wayfinder routes/actions
        run: php artisan wayfinder:generate --with-form

      - name: Typecheck (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Run PHP test suite
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Build assets
        run: npm run build

  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy production .env for build
        run: cp /var/www/laravel/cryptor/.env .env

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Install NPM dependencies & build assets
        run: |
          npm ci
          npm run build

      - name: Sync files to deployment path
        run: |
          rsync -a --delete \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/' \
            --exclude='node_modules/' \
            ./ /var/www/laravel/cryptor/

      - name: Run deployment tasks
        run: |
          cd /var/www/laravel/cryptor
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          sudo systemctl reload php8.4-fpm
          sudo systemctl reload nginx
