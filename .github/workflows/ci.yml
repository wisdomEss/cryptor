name: CI

# Tests + lint, exécutés sur un runner GitHub (jamais sur le serveur).
# Utilisé sur les pull requests et appelé par deploy.yml avant le déploiement.
on:
  pull_request:
  push:
    branches-ignore: [ main ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, openssl
          coverage: pcov

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Generate app key
        run: php artisan key:generate

      - name: Install NPM dependencies
        run: npm ci

      - name: Lint PHP (Pint)
        run: vendor/bin/pint --test

      # Doit précéder ESLint : `import/order` a besoin que `@/routes` et
      # `@/actions` (ignorés par git) existent pour les classer comme en local.
      - name: Generate Wayfinder routes/actions
        run: php artisan wayfinder:generate --with-form

      - name: Lint JS/Vue (ESLint)
        # `npm run lint` auto-fixes (--fix); here we only want to check.
        run: npx eslint .

      - name: Typecheck (vue-tsc)
        run: npx vue-tsc --noEmit

      # Doit précéder les tests : les pages Inertia lisent public/build/manifest.json.
      - name: Build assets
        run: npm run build

      - name: Run PHP test suite (with coverage)
        run: vendor/bin/phpunit --coverage-clover=coverage.xml
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      # Seuil réglable sans commit : Settings > Secrets and variables > Actions > Variables > COVERAGE_MIN.
      # Absent ou 0 : le rapport est publié mais ne bloque rien.
      - name: Coverage summary and threshold
        run: php scripts/coverage-check.php coverage.xml "${COVERAGE_MIN:-0}" >> "$GITHUB_STEP_SUMMARY"
        env:
          COVERAGE_MIN: ${{ vars.COVERAGE_MIN }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7
          if-no-files-found: ignore

  # Les tests principaux tournent sur SQLite (rapide). La production utilise MySQL : ce job rejoue
  # les migrations et toute la suite sur un vrai MySQL 8 pour détecter les écarts de comportement.
  test-mysql:
    name: test (MySQL 8)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: cryptor_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -psecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_mysql, openssl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Generate app key
        run: php artisan key:generate

      - name: Install NPM dependencies
        run: npm ci

      - name: Generate Wayfinder routes/actions
        run: php artisan wayfinder:generate --with-form

      # Les pages Inertia lisent public/build/manifest.json.
      - name: Build assets
        run: npm run build

      - name: Run migrations on MySQL
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cryptor_test
          DB_USERNAME: root
          DB_PASSWORD: secret

      - name: Run PHP test suite on MySQL
        run: vendor/bin/phpunit
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cryptor_test
          DB_USERNAME: root
          DB_PASSWORD: secret

