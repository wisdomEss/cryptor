name: CI

# Tests + lint, exécutés sur un runner GitHub (jamais sur le serveur).
# Utilisé sur les pull requests et appelé par deploy.yml avant le déploiement.
on:
  pull_request:
  push:
    branches-ignore: [ main ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, openssl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Generate app key
        run: php artisan key:generate

      - name: Install NPM dependencies
        run: npm ci

      - name: Lint PHP (Pint)
        run: vendor/bin/pint --test

      # Doit précéder ESLint : `import/order` a besoin que `@/routes` et
      # `@/actions` (ignorés par git) existent pour les classer comme en local.
      - name: Generate Wayfinder routes/actions
        run: php artisan wayfinder:generate --with-form

      - name: Lint JS/Vue (ESLint)
        # `npm run lint` auto-fixes (--fix); here we only want to check.
        run: npx eslint .

      - name: Typecheck (vue-tsc)
        run: npx vue-tsc --noEmit

      # Doit précéder les tests : les pages Inertia lisent public/build/manifest.json.
      - name: Build assets
        run: npm run build

      - name: Run PHP test suite
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
