name: Security (SAST)

# Analyse statique : CodeQL (JS/TS/Vue) + Semgrep (PHP/Laravel).
# Tourne sur des runners GitHub uniquement, jamais sur le serveur self-hosted.
# Aucun secret requis. Résultats : onglet Security > Code scanning.
on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  semgrep:
    name: Semgrep (PHP/Laravel)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: >
          semgrep scan
          --config p/php
          --config p/owasp-top-ten
          --config p/secrets
          --sarif --output semgrep.sarif
          --metrics off
          app routes config database resources/views
        env:
          SEMGREP_SEND_METRICS: 'off'

      - name: Upload results to GitHub code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
